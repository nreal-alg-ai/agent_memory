# Main runtime parameters for AI-glasses voice processing.
# Most runtime/model parameters live here. main.py CLI only keeps startup-level
# switches such as --config, --list-devices, --assistant_wakup/--no-assistant_wakeup,
# --kws/--no-kws, --speaker-identification/--no-speaker-identification,
# and --allday-recording/--no-allday-recording.

runtime:
  # Use "mic" for local microphone, or "file" to replay an audio file as a stream.
  source: file
  # audio: /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_far/audio_dir/R8001_M8004_MS801.wav
  # Optional. When set, main.py replays these files sequentially and keeps models resident.
  # audio_files takes precedence over audio.
  audio_files: [
    # /Users/zhouboyu/Documents/voice_recording/tmp_result/ai_glasses_voice/20260721_155749_remote_audio/remote_microphone_20260721_155803.wav
    /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8001_M8004_N_SPK8013.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8001_M8004_N_SPK8014.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8001_M8004_N_SPK8015.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8001_M8004_N_SPK8016.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8003_M8001_N_SPK8001.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8003_M8001_N_SPK8002.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8003_M8001_N_SPK8003.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8003_M8001_N_SPK8004.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8010_N_SPK8050.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8010_N_SPK8054.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8010_N_SPK8055.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8010_N_SPK8056.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8011_N_SPK8066.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8011_N_SPK8067.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8011_N_SPK8068.wav,
    # /Users/zhouboyu/Documents/voice_recording/external/Eval_Ali/Eval_Ali_near/audio_dir/R8007_M8011_N_SPK8069.wav,
  ]
  # Simulated wall-clock gap between two consecutive audio files.
  audio_gap_s: 120.0
  result_root: tmp_result/ai_glasses_voice
  sample_rate: 16000
  language: zh
  device: null
  max_duration_s: null
  pace_file_realtime: false
  mic_device: null
  mic_channels: 1

vad:
  frame_ms: 32.0
  threshold: 0.5
  min_silence_ms: 100
  speech_pad_ms: 30
  window_frames: 5
  activate_ratio: 0.6
  deactivate_ratio: 0.4

streaming_asr:
  paraformer_streaming_model_id: funasr/paraformer-zh-streaming
  trigger_s: 0.6
  simplify_chinese: true
  print_empty: false

nonstreaming_asr:
  paraformer_model_id: funasr/paraformer-zh
  simplify_chinese: true
  print_empty: false

kws:
  enabled: false
  tokens: assets/sherp-onnx/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/tokens.txt
  encoder: assets/sherp-onnx/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/encoder-epoch-13-avg-2-chunk-16-left-64.onnx
  decoder: assets/sherp-onnx/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/decoder-epoch-13-avg-2-chunk-16-left-64.onnx
  joiner: assets/sherp-onnx/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/joiner-epoch-13-avg-2-chunk-16-left-64.onnx
  keywords_file: assets/sherp-onnx/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/keywords_script.txt
  inline_keywords: null
  num_threads: 2
  provider: cpu
  device: 0
  feature_dim: 80
  max_active_paths: 4
  keywords_score: 1.0
  keywords_threshold: 0.25
  num_trailing_blanks: 1

speaker_identification:
  enabled: true
  model_id: iic/speech_campplus_sv_zh-cn_16k-common
  window_s: 2.048
  similarity_threshold: 0.5
  reference_memory_size: 10
  min_new_reference_segments: 2
  min_new_reference_duration_s: 2.0
  user_similarity_threshold: null
  user_reference_audio: []
  speaker_assignment_method: agglomerative

assistant_wakeup:
  enabled: false

allday_recording:
  enabled: true
  max_pending_segment_num: 20
  max_pending_duration_s: 300.0
  max_pending_gap_s: 30.0
  min_segment_s: 0.0

chat:
  enabled: false
  llm_provider: deepseek
  llm_name: deepseek-v4-flash
  llm_base_url: https://api.deepseek.com
  llm_api_key: ${DEEPSEEK_API_KEY}

remote_audio:
  # Bind to 0.0.0.0 so phones on the same LAN can open http://电脑IP:8765.
  # Phone browsers usually require HTTPS for microphone access. Configure
  # ssl_certfile/ssl_keyfile and open https://电脑IP:8765 if HTTP is blocked.
  host: 0.0.0.0
  port: 8765
  auth_token: null
  client_title: AI Glasses Voice
  max_clients: 1
  incoming_sample_format: pcm16
  status_interval_s: 2.0
  save_received_audio: false
  ssl_certfile: certs/voice_recording.pem
  ssl_keyfile: certs/voice_recording-key.pem
  user_reference_audio_dir: assets/user_reference_audio_files

memory_runtime:
  memory_prompt_language_mode: zh
  memory_output_language_mode: zh
  assistant_wakeup_segmentation:
    max_pending_interaction_turns: 10
    max_pending_interaction_tokens: 500
    min_pending_interaction_turns: 2
    min_pending_interaction_tokens: 200
    threshold: 0.6
    bias: -1.1
    surprise_history_window: 64
    min_surprise_history: 5
    robust_surprise_weight: 0.8
    absolute_surprise_weight: 0.8
    cohesion_drop_weight: 0.8
    length_weight: 0.40
    turn_count_weight: 0.4
    max_time_gap_seconds: 30

  allday_recording_segmentation:
    transcript_episode_max_segments: 80
    transcript_episode_max_chars: 12000
    threshold: 0.6
    surprise_history_window: 64
    min_surprise_history: 5
    robust_surprise_weight: 0.8
    absolute_surprise_weight: 0.8
    cohesion_drop_weight: 0.8
    turn_count_weight: 0.4
    min_chunk_tokens: 500
    max_chunk_tokens: 2000
    max_time_gap_seconds: 60.0

memory_manager:
  memory_enabled: true
  enable_memory_state_update: true
  enable_memory_actionable_item_update: false
  llm:
    llm_provider: deepseek
    llm_name: deepseek-v4-flash
    llm_base_url: https://api.deepseek.com
    llm_api_key: ${DEEPSEEK_API_KEY}
    llm_timeout: 120
    llm_thinking: disabled
    llm_json_mode: true
  embedding:
    enabled: true
    provider: openai
    model: embedding-3
    base_url: https://api.z.ai/api/paas/v4
    api_key: ${GLM_API_KEY}
    api_key_env: GLM_API_KEY
    dimensions: 2048
    normalize: true

  save_db_name: memory.db
  retrieval_top_k: 8
  recall_detailed_logging: true
  recall_fast_candidate_min_score: 0.30
  recall_fast_candidate_score_threshold: 0.65

  store_queue_maxsize: 100

  reflect_interval_seconds: 7200
  reflect_limit: 100
  recall_budget: mid
  recall_fact_min_embedding_similarity: 0.30
  recall_state_min_embedding_similarity: 0.25
  recall_actionable_item_min_embedding_similarity: 0.25
  recall_gate_mode: auto
